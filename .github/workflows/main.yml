name: Build iOS & macOS
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  build-ios-macos:
    name: Build iOS & macOS
    runs-on: macos-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v3

      # Setup Java (required for Flutter)
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # Get dependencies
      - run: flutter pub get

      # Build iOS (unsigned)
      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r app.ipa Payload

      # Build macOS
      - run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r app-macos.zip *.app

      # Upload artifacts to GitHub Release
      - name: Upload iOS & macOS builds
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/ios/iphoneos/app.ipa,
            build/macos/Build/Products/Release/app-macos.zip
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
